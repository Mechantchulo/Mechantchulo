name: Refresh profile art
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/profile_art.py', '.github/workflows/update-profile-art.yml']
permissions:
  contents: write
concurrency:
  group: profile-art
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/profile_art.py
      - name: Commit refreshed art
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets data
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile art [skip ci]'
            git push
          fi
